# Progetto Xcode dell'app per iPhone e iPad: `xcodegen` lo genera (OpenSlate.xcodeproj).
name: OpenSlate
options:
  bundleIdPrefix: org.openslate
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    # la tua squadra (Xcode → Signing & Capabilities) per installarla sull'iPhone
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  # Il cuore Rust (mobile/core) in un bersaglio a sé, compilato PRIMA
  # dell'app: Xcode copia le intestazioni dell'XCFramework all'inizio, quindi
  # uno script dentro l'app arriverebbe tardi dopo una modifica al cuore.
  RustCore:
    type: ""
    platform: iOS
    legacy:
      toolPath: /bin/sh
      arguments: "$(SRCROOT)/build-rust.sh"
      workingDirectory: $(SRCROOT)
      passSettings: true
  OpenSlate:
    type: application
    platform: iOS
    sources:
      - path: OpenSlate
      - path: Generated/swift/openslate_mobile.swift
        optional: true
    dependencies:
      - target: RustCore
      - framework: Generated/OpenSlateCore.xcframework
        embed: false
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework
      - sdk: CoreBluetooth.framework
      - sdk: PDFKit.framework
      - sdk: VisionKit.framework
      - sdk: Network.framework
    info:
      path: OpenSlate/Info.plist
      properties:
        CFBundleDisplayName: OpenSlate
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown]
        UIRequiresFullScreen: true
        UIBackgroundModes: [bluetooth-central]
        NSBluetoothAlwaysUsageDescription: "OpenSlate si collega al tuo Bamboo Slate via Bluetooth. / OpenSlate connects to your Bamboo Slate over Bluetooth."
        NSCameraUsageDescription: "Per inquadrare i QR della desktop (impostazioni AI, sincronizzazione). / To scan the desktop app's QR codes (AI settings, sync)."
        NSMicrophoneUsageDescription: "Per dettare i messaggi alla chat AI, solo quando tocchi il microfono. / To dictate messages to the AI chat, only when you tap the microphone."
        NSSpeechRecognitionUsageDescription: "Per trasformare in testo i messaggi che detti alla chat AI (sul telefono, quando la lingua lo permette). / To turn the messages you dictate to the AI chat into text (on the device when the language allows it)."
        NSLocalNetworkUsageDescription: "Per sincronizzarti col tuo computer e usare la sua AI (LM Studio, Ollama). / To sync with your computer and use its AI (LM Studio, Ollama)."
        NSBonjourServices: [_openslate-sync._tcp]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.openslate.ios
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        OTHER_LDFLAGS: ["-lc++"]
        DEAD_CODE_STRIPPING: YES
