# Progetto Xcode dell'app per iPhone e iPad: `xcodegen` lo genera (OpenSlate.xcodeproj).
name: OpenSlate
options:
  bundleIdPrefix: org.openslate
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    # la tua squadra (Xcode → Signing & Capabilities) per installarla sull'iPhone
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  OpenSlate:
    type: application
    platform: iOS
    sources:
      - path: OpenSlate
      - path: Generated/swift/openslate_mobile.swift
        optional: true
    dependencies:
      - framework: Generated/OpenSlateCore.xcframework
        embed: false
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework
      - sdk: CoreBluetooth.framework
      - sdk: PDFKit.framework
      - sdk: VisionKit.framework
    preBuildScripts:
      - name: "Cuore Rust (mobile/core)"
        script: '"$SRCROOT/build-rust.sh"'
        basedOnDependencyAnalysis: false
    info:
      path: OpenSlate/Info.plist
      properties:
        CFBundleDisplayName: OpenSlate
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIBackgroundModes: [bluetooth-central]
        NSBluetoothAlwaysUsageDescription: "OpenSlate si collega al tuo Bamboo Slate via Bluetooth. / OpenSlate connects to your Bamboo Slate over Bluetooth."
        NSCameraUsageDescription: "Per inquadrare il QR delle impostazioni AI della desktop. / To scan the AI settings QR code from the desktop app."
        NSLocalNetworkUsageDescription: "Per usare l'AI sul tuo computer (LM Studio, Ollama). / To use the AI on your computer (LM Studio, Ollama)."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.openslate.ios
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        OTHER_LDFLAGS: ["-lc++"]
        DEAD_CODE_STRIPPING: YES
