[package]
name = "openslate-mobile"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "OpenSlate per telefoni e tablet (Android e iOS): il cuore Rust, con gli stessi file della desktop"
publish = false

[lib]
name = "openslate_mobile"
# cdylib per Android, staticlib per iOS
crate-type = ["cdylib", "staticlib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
required-features = ["cli"]

[features]
cli = ["uniffi/cli"]

[dependencies]
uniffi = "0.32"
uuid = "1"
thiserror = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tracing = "0.1"
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
flate2 = "1"
gif = "0.14"
color_quant = "1.1"
ureq = { version = "2", features = ["json"] }
anyhow = "1"
tiny-skia = "0.11"
# il timbro aziendale (src/stamp.rs): testo dai font Inter
ab_glyph = "0.2"
# i PDF firmati: lo stesso lopdf della desktop (quello di PdfCraft, vedi [patch])
lopdf = { version = "0.45", default-features = false }
# Word, foto e SVG firmati con le librerie della suite Craft (MIT OR Apache-2.0,
# © ArtCraft Team), le stesse versioni della desktop
wordcraft-engine = { git = "https://github.com/storytold/wordcraft", rev = "5574b32600aa7d782c64f5a6c6bb24696152220d" }
photocraft-codecs = { git = "https://github.com/storytold/photocraft", rev = "5000240c6e5dc30a024d20f97a620c78eca10d1e" }
photocraft-paint = { git = "https://github.com/storytold/photocraft", rev = "5000240c6e5dc30a024d20f97a620c78eca10d1e" }
photocraft-raster = { git = "https://github.com/storytold/photocraft", rev = "5000240c6e5dc30a024d20f97a620c78eca10d1e" }
photocraft-color = { git = "https://github.com/storytold/photocraft", rev = "5000240c6e5dc30a024d20f97a620c78eca10d1e" }
photocraft-geom = { git = "https://github.com/storytold/photocraft", rev = "5000240c6e5dc30a024d20f97a620c78eca10d1e" }
vectorcraft-engine = { git = "https://github.com/storytold/vectorcraft", rev = "5d0e892e2419f63bc0ea3c743ddff2e81e15fd3a" }
vectorcraft-render = { git = "https://github.com/storytold/vectorcraft", rev = "5d0e892e2419f63bc0ea3c743ddff2e81e15fd3a" }

[profile.release]
opt-level = "s"
lto = true
strip = true
# una sola unità per libreria: più piccola (i motori Craft sono grandi)
codegen-units = 1

# come la desktop: krilla e hayro-* da craft-libs, hayro-jbig2 e lopdf da PdfCraft
[patch.crates-io]
krilla = { git = "https://github.com/storytold/craft-libs", rev = "1b34eba41e62138fc2438d2734523b302840b45d" }
hayro-interpret = { git = "https://github.com/storytold/craft-libs", rev = "1b34eba41e62138fc2438d2734523b302840b45d" }
hayro-syntax = { git = "https://github.com/storytold/craft-libs", rev = "1b34eba41e62138fc2438d2734523b302840b45d" }
hayro-jbig2 = { git = "https://github.com/storytold/pdfcraft", rev = "2ad7717f87ad6f15b14bdf22cddc1019d6fd0aed" }
lopdf = { git = "https://github.com/storytold/pdfcraft", rev = "2ad7717f87ad6f15b14bdf22cddc1019d6fd0aed" }
