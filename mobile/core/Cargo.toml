[package]
name = "openslate-mobile"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "OpenSlate per telefoni e tablet (Android e iOS): il cuore Rust, con gli stessi file della desktop"
publish = false

[lib]
name = "openslate_mobile"
# cdylib per Android, staticlib per iOS
crate-type = ["cdylib", "staticlib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
required-features = ["cli"]

[features]
cli = ["uniffi/cli"]

[dependencies]
uniffi = "0.32"
uuid = "1"
thiserror = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tracing = "0.1"
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
flate2 = "1"
gif = "0.14"
color_quant = "1.1"
ureq = { version = "2", features = ["json"] }
anyhow = "1"
tiny-skia = "0.11"
# il timbro aziendale (src/stamp.rs): testo dai font Inter
ab_glyph = "0.2"
# i PDF firmati: lo stesso lopdf della desktop (quello di PdfCraft, vedi [patch])
lopdf = { version = "0.45", default-features = false }
# Word, foto e SVG firmati con le librerie della suite Craft (MIT OR Apache-2.0,
# © ArtCraft Team), le stesse versioni della desktop
wordcraft-engine = { git = "https://github.com/storytold/wordcraft", rev = "a8db235e051ad21d9223209aed1824c4ed511905" }
photocraft-codecs = { git = "https://github.com/storytold/photocraft", rev = "7f148de8258aad3a4a751aad3c9fcbfe936d122f" }
photocraft-paint = { git = "https://github.com/storytold/photocraft", rev = "7f148de8258aad3a4a751aad3c9fcbfe936d122f" }
photocraft-raster = { git = "https://github.com/storytold/photocraft", rev = "7f148de8258aad3a4a751aad3c9fcbfe936d122f" }
photocraft-color = { git = "https://github.com/storytold/photocraft", rev = "7f148de8258aad3a4a751aad3c9fcbfe936d122f" }
photocraft-geom = { git = "https://github.com/storytold/photocraft", rev = "7f148de8258aad3a4a751aad3c9fcbfe936d122f" }
vectorcraft-engine = { git = "https://github.com/storytold/vectorcraft", rev = "9840b65a85d888d66dfbd791ee3a6313984a9ad2" }
vectorcraft-render = { git = "https://github.com/storytold/vectorcraft", rev = "9840b65a85d888d66dfbd791ee3a6313984a9ad2" }
# sincronizzazione col computer (src/sync): buste cifrate e impronte dei file
chacha20poly1305 = "0.10"
sha2 = "0.10"

[profile.release]
opt-level = "s"
lto = true
strip = true
# una sola unità per libreria: più piccola (i motori Craft sono grandi)
codegen-units = 1

# come la desktop: krilla e hayro-* da craft-libs, hayro-jbig2 e lopdf da PdfCraft
[patch.crates-io]
krilla = { git = "https://github.com/storytold/craft-libs", rev = "1b34eba41e62138fc2438d2734523b302840b45d" }
hayro-interpret = { git = "https://github.com/storytold/craft-libs", rev = "1b34eba41e62138fc2438d2734523b302840b45d" }
hayro-syntax = { git = "https://github.com/storytold/craft-libs", rev = "1b34eba41e62138fc2438d2734523b302840b45d" }
hayro-jbig2 = { git = "https://github.com/storytold/pdfcraft", rev = "37fde37781274111973b864b38df75233c1b9191" }
lopdf = { git = "https://github.com/storytold/pdfcraft", rev = "37fde37781274111973b864b38df75233c1b9191" }
