[package]
name = "openslate-mobile"
version = "0.6.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "OpenSlate per telefoni e tablet (Android e iOS): il cuore Rust, con gli stessi file della desktop"
publish = false

[lib]
name = "openslate_mobile"
# cdylib per Android, staticlib per iOS
crate-type = ["cdylib", "staticlib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
required-features = ["cli"]

[features]
cli = ["uniffi/cli"]

[dependencies]
uniffi = "0.32"
uuid = "1"
thiserror = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tracing = "0.1"
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
flate2 = "1"
gif = "0.14"
color_quant = "1.1"
ureq = { version = "2", features = ["json"] }
anyhow = "1"
tiny-skia = "0.11"
# il timbro aziendale (src/stamp.rs): testo dai font Inter
ab_glyph = "0.2"
# i PDF firmati: lo stesso lopdf della desktop (quello di PdfCraft, vedi [patch])
lopdf = { version = "0.45", default-features = false }
# il testo dei PDF con le posizioni, per trovare dove vanno firma e timbro
# (src/signspot.rs della desktop): il lettore della suite Craft (vedi [patch])
hayro-interpret = "0.7"
kurbo = "0.13"
# Word e foto firmati con le librerie della suite Craft (MIT OR Apache-2.0,
# © ArtCraft Team), le stesse versioni della desktop
wordcraft-engine = { git = "https://github.com/storytold/wordcraft", rev = "f83d5543221a066a9b20e4e8d9288e1c283028af" }
photocraft-codecs = { package = "craft-image-codecs", git = "https://www.github.com/storytold/craft-libs", rev = "a46af76c7c74dd8dd375d694baaef00d5ae836a2" }
photocraft-paint = { git = "https://github.com/storytold/photocraft", rev = "d600edeaf475e503ce14fa47b77d31a083c5ff70" }
photocraft-raster = { git = "https://github.com/storytold/photocraft", rev = "d600edeaf475e503ce14fa47b77d31a083c5ff70" }
photocraft-color = { git = "https://github.com/storytold/photocraft", rev = "d600edeaf475e503ce14fa47b77d31a083c5ff70" }
photocraft-geom = { git = "https://github.com/storytold/photocraft", rev = "d600edeaf475e503ce14fa47b77d31a083c5ff70" }
# gli SVG (src/vecsign.rs, src/craftexport.rs di qui): resvg li disegna, la firma
# si scrive nel file. Non VectorCraft come sulla desktop: il suo motore da solo
# era metà dell'app (effetti, plugin, CAD, EPS e la sua interfaccia).
resvg = { version = "0.48", default-features = false, features = ["text", "raster-images", "memmap-fonts"] }
usvg = { version = "0.48", default-features = false, features = ["text"] }
# i caratteri del telefono per i testi negli SVG (load_fonts_dir)
fontdb = { version = "0.24", default-features = false, features = ["fs", "memmap"] }
roxmltree = "0.21"
# sincronizzazione col computer (src/sync): buste cifrate e impronte dei file
chacha20poly1305 = "0.10"
sha2 = "0.10"

[profile.release]
opt-level = "s"
lto = true
strip = true
# una sola unità per libreria: più piccola (i motori Craft sono grandi)
codegen-units = 1

# come la desktop: krilla e hayro-* da craft-libs, hayro-jbig2 e lopdf da PdfCraft
[patch.crates-io]
krilla = { git = "https://www.github.com/storytold/craft-libs", rev = "a46af76c7c74dd8dd375d694baaef00d5ae836a2" }
hayro-interpret = { git = "https://www.github.com/storytold/craft-libs", rev = "a46af76c7c74dd8dd375d694baaef00d5ae836a2" }
hayro-syntax = { git = "https://www.github.com/storytold/craft-libs", rev = "a46af76c7c74dd8dd375d694baaef00d5ae836a2" }
hayro-jbig2 = { git = "https://www.github.com/storytold/craft-libs", rev = "a46af76c7c74dd8dd375d694baaef00d5ae836a2" }
lopdf = { git = "https://github.com/storytold/pdfcraft", rev = "c34c6c5a0bd86d466f9f814c14b4cfdaa55cd7e2" }

# una sola craft-libs per tutta la suite Craft (WordCraft, VectorCraft e PhotoCraft
# ne fissano ognuna una sua): senza, una ventina di librerie entra due o tre volte.
