name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14]
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev libdbus-1-dev libxkbcommon-dev

      - uses: Swatinem/rust-cache@v2

      - name: Swift helpers (macOS)
        if: runner.os == 'macOS'
        run: |
          # gli aiutanti in Swift (OCR di Vision, video con AVFoundation) si compilano
          for f in src/swift/*.swift; do
            d="$RUNNER_TEMP/swift-$(basename "$f" .swift)"; mkdir -p "$d"
            cp "$f" "$d/main.swift"
            swiftc -O -o "$d/helper" "$d/main.swift"
          done

      - name: Build
        run: cargo build --locked

      - name: Test
        run: cargo test --locked

  check-windows:
    # Windows: si controlla che compili (il video con Media Foundation è solo lì)
    name: Check (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Check
        run: cargo check --locked
