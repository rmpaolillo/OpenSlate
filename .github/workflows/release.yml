name: Release

# A release is published only when you decide: Actions → Release → "Run workflow" (branch main).
# Version = MAJOR.MINOR taken from Cargo.toml + PATCH counted from the existing tags:
#   Cargo.toml 0.2.x, no v0.2.* tag yet  -> v0.2.0
#   last tag v0.2.4                       -> v0.2.5
# To start a new series (0.3.0, 1.0.0…) change the version in Cargo.toml.
# CI (ci.yml) still builds and tests every push and pull request.

on:
  workflow_dispatch:

# solo lettura di serie; il passo che pubblica la release chiede di più
permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # the app knows it comes from a release: it then tells the user about newer releases
  OPENSLATE_RELEASE: "1"

jobs:
  version:
    # solo dal ramo principale
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true
      - id: v
        run: |
          base=$(sed -n 's/^version = "\([0-9]*\)\.\([0-9]*\)\..*"/\1.\2/p' Cargo.toml | head -1)
          test -n "$base" || { echo "versione non trovata in Cargo.toml"; exit 1; }
          last=$(git tag -l "v$base.*" | sed "s/^v$base\.//" | grep -E '^[0-9]+$' | sort -n | tail -1 || true)
          if [ -z "$last" ]; then patch=0; else patch=$((last + 1)); fi
          echo "Version: $base.$patch"
          echo "version=$base.$patch" >> "$GITHUB_OUTPUT"

  macos:
    name: macOS (universal)
    needs: version
    runs-on: macos-14
    env:
      VERSION: ${{ needs.version.outputs.version }}
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    # Apple Developer ID (optional, as in ArtCraft's Craft apps): with the repository secrets
    # APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_ID, APPLE_PASSWORD and APPLE_TEAM_ID
    # the app is signed with the Developer ID and notarized by Apple, so macOS opens it with no
    # warning. Without them it is signed ad hoc (the user must allow it once).
    # The secrets are given only to the signing and notarization steps, after the build: the
    # build scripts of the dependencies never see them, and the signing keychain does not exist
    # while they run.
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Set version
        run: |
          perl -0pi -e 's/^version = "[^"]*"/version = "$ENV{VERSION}"/m' Cargo.toml
          perl -0pi -e 's/(name = "openslate"\nversion = ")[^"]*"/$1$ENV{VERSION}"/' Cargo.lock

      - name: Test
        run: cargo test --release --locked --target aarch64-apple-darwin

      - name: Build (arm64 + x86_64)
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin

      - name: Third-party licences (full texts)
        run: python3 packaging/collect_licenses.py build/THIRD-PARTY-LICENSES.txt

      - name: Signing certificate (Developer ID, if configured)
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          HAS_NOTARY: ${{ secrets.APPLE_ID != '' && secrets.APPLE_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "::warning::APPLE_CERTIFICATE not set: the app will be signed ad hoc and not notarized"
            exit 0
          fi
          umask 077
          KEYCHAIN="$RUNNER_TEMP/openslate-signing.keychain-db"
          CERT="$RUNNER_TEMP/openslate-signing.p12"
          KC_PASS="$(openssl rand -hex 24)"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$CERT"
          security create-keychain -p "$KC_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KC_PASS" "$KEYCHAIN"
          security import "$CERT" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security -t cert -f pkcs12 -k "$KEYCHAIN"
          rm -f "$CERT"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PASS" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | awk '/Developer ID Application/ { print $2; exit }')"
          test -n "$IDENTITY" || { echo "no 'Developer ID Application' identity in APPLE_CERTIFICATE"; exit 1; }
          echo "MACOS_SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "MACOS_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          if [ "$HAS_NOTARY" = "true" ]; then echo "CAN_NOTARIZE=1" >> "$GITHUB_ENV"; fi

      - name: Swift helper (Apple Vision OCR)
        run: |
          mkdir -p build/helpers
          for name in vision_ocr; do
            for arch in arm64 x86_64; do
              d="build/swift/$name-$arch"; mkdir -p "$d"
              cp "src/swift/$name.swift" "$d/main.swift"
              swiftc -O -target "$arch-apple-macos11.0" -o "$d/$name" "$d/main.swift"
            done
            lipo -create -output "build/helpers/$name" \
              "build/swift/$name-arm64/$name" "build/swift/$name-x86_64/$name"
          done

      - name: App bundle
        run: |
          APP=build/OpenSlate.app
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources/helpers"
          lipo -create -output "$APP/Contents/MacOS/openslate" \
            target/aarch64-apple-darwin/release/openslate \
            target/x86_64-apple-darwin/release/openslate
          cp build/helpers/* "$APP/Contents/Resources/helpers/"
          sed "s/@VERSION@/$VERSION/g" packaging/macos/Info.plist > "$APP/Contents/Info.plist"
          cp LICENSE NOTICE THIRD-PARTY.md build/THIRD-PARTY-LICENSES.txt "$APP/Contents/Resources/"
          # icon
          ICONSET=build/OpenSlate.iconset; mkdir -p "$ICONSET"
          for s in 16 32 128 256 512; do
            cp "assets/icon/openslate-$s.png" "$ICONSET/icon_${s}x${s}.png"
            cp "assets/icon/openslate-$((s*2)).png" "$ICONSET/icon_${s}x${s}@2x.png"
          done
          iconutil -c icns -o "$APP/Contents/Resources/OpenSlate.icns" "$ICONSET"
          printf 'APPL????' > "$APP/Contents/PkgInfo"
          xattr -cr "$APP"
          # Sign inside-out: helpers, the executable, then the bundle. With a Developer ID:
          # hardened runtime + secure timestamp (needed for notarization); otherwise ad hoc.
          sign() {
            if [ -n "${MACOS_SIGN_IDENTITY:-}" ]; then
              codesign --force --sign "$MACOS_SIGN_IDENTITY" --keychain "$MACOS_KEYCHAIN" --timestamp \
                --options runtime --entitlements packaging/macos/entitlements.plist "$@"
            else
              codesign --force --sign - --timestamp=none "$@"
            fi
          }
          for h in "$APP"/Contents/Resources/helpers/*; do sign "$h"; done
          sign "$APP/Contents/MacOS/openslate"
          sign "$APP"
          codesign --verify --strict --deep --verbose=2 "$APP"

      - name: Notarize the app (if configured)
        if: env.MACOS_SIGN_IDENTITY != '' && env.CAN_NOTARIZE == '1'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          ditto -c -k --keepParent build/OpenSlate.app build/notarize.zip
          xcrun notarytool submit build/notarize.zip --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" --wait --timeout 1h
          xcrun stapler staple build/OpenSlate.app
          xcrun stapler validate build/OpenSlate.app
          spctl --assess --type execute -vvv build/OpenSlate.app
          echo "NOTARIZED=1" >> "$GITHUB_ENV"

      - name: DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          mkdir -p build/dmg dist
          cp -R build/OpenSlate.app build/dmg/
          ln -s /Applications build/dmg/Applications
          # hdiutil a volte fallisce con "Resource busy" sui runner: si riprova
          for i in 1 2 3; do
            hdiutil create -volname "OpenSlate $VERSION" -srcfolder build/dmg -ov -format UDZO \
              "dist/OpenSlate-$VERSION-macos-universal.dmg" && break
            sleep 10
          done
          test -f "dist/OpenSlate-$VERSION-macos-universal.dmg"
          # the disk image too: signed, notarized and stapled (with a Developer ID)
          if [ -n "${NOTARIZED:-}" ]; then
            DMG="dist/OpenSlate-$VERSION-macos-universal.dmg"
            codesign --force --sign "$MACOS_SIGN_IDENTITY" --keychain "$MACOS_KEYCHAIN" --timestamp "$DMG"
            xcrun notarytool submit "$DMG" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" --wait --timeout 1h
            xcrun stapler staple "$DMG"
          fi

      - uses: actions/upload-artifact@v5
        with:
          name: macos
          path: dist/*
          if-no-files-found: error

  linux:
    name: Linux (x86_64)
    needs: version
    # older Ubuntu = older glibc = runs on more distributions
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev libdbus-1-dev libxkbcommon-dev

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb

      - name: Set version
        run: |
          perl -0pi -e 's/^version = "[^"]*"/version = "$ENV{VERSION}"/m' Cargo.toml
          perl -0pi -e 's/(name = "openslate"\nversion = ")[^"]*"/$1$ENV{VERSION}"/' Cargo.lock

      - name: Build
        run: cargo build --release --locked

      - name: Third-party licences (full texts)
        run: python3 packaging/collect_licenses.py build/THIRD-PARTY-LICENSES.txt

      - name: tar.gz
        run: |
          D="openslate-$VERSION-linux-x86_64"
          mkdir -p "build/$D" dist
          cp target/release/openslate README.md LICENSE NOTICE THIRD-PARTY.md build/THIRD-PARTY-LICENSES.txt "build/$D/"
          cp packaging/linux/openslate.desktop assets/icon/openslate-256.png "build/$D/"
          tar -C build -czf "dist/$D.tar.gz" "$D"

      - name: .deb
        run: |
          cargo deb --no-build --deb-version "$VERSION" -o "dist/openslate_${VERSION}_amd64.deb"

      - uses: actions/upload-artifact@v5
        with:
          name: linux
          path: dist/*
          if-no-files-found: error

  windows:
    name: Windows (x86_64, experimental)
    needs: version
    runs-on: windows-latest
    continue-on-error: true
    env:
      VERSION: ${{ needs.version.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Set version
        run: |
          perl -0pi -e 's/^version = "[^"]*"/version = "$ENV{VERSION}"/m' Cargo.toml
          perl -0pi -e 's/(name = "openslate"\r?\nversion = ")[^"]*"/$1$ENV{VERSION}"/' Cargo.lock

      - name: Build
        run: cargo build --release --locked

      - name: Third-party licences (full texts)
        # Python su Windows legge e scrive in cp1252 se non glielo si dice
        env:
          PYTHONUTF8: "1"
        run: python packaging/collect_licenses.py build/THIRD-PARTY-LICENSES.txt

      - name: zip
        shell: pwsh
        run: |
          $d = "openslate-$env:VERSION-windows-x86_64"
          New-Item -ItemType Directory -Force -Path "build/$d", dist | Out-Null
          Copy-Item target/release/openslate.exe, README.md, LICENSE, NOTICE, THIRD-PARTY.md, build/THIRD-PARTY-LICENSES.txt, assets/icon/openslate.ico "build/$d/"
          Compress-Archive -Path "build/$d" -DestinationPath "dist/$d.zip"

      - uses: actions/upload-artifact@v5
        with:
          name: windows
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: [version, macos, linux, windows]
    # Windows is experimental: a failed Windows build does not block the release
    if: ${{ !cancelled() && needs.macos.result == 'success' && needs.linux.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - name: Checksums (the app checks them when it updates itself)
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - run: ls -la dist

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: OpenSlate ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          make_latest: true
          body: |
            ## Install

            - **macOS 11+** (Apple Silicon and Intel): `OpenSlate-${{ env.VERSION }}-macos-universal.dmg`.
              If macOS says it cannot verify the app (builds without the Developer ID), allow it once:
              right-click → **Open**, or System Settings → Privacy & Security → **Open Anyway**.

            Already installed? OpenSlate updates itself: **Update** in the blue bar.
            - **Debian / Ubuntu**: `sudo apt install ./openslate_${{ env.VERSION }}_amd64.deb`
            - **Other Linux**: `openslate-${{ env.VERSION }}-linux-x86_64.tar.gz`
            - **Windows** (experimental, when present): `openslate-${{ env.VERSION }}-windows-x86_64.zip`

            See the [README](https://github.com/rmpaolillo/OpenSlate#install) for details.
          files: dist/*
          fail_on_unmatched_files: true
