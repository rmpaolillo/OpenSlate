<!doctype html>
<html lang="it">
<head>
<script src="i18n.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Appunti — OpenSlate</title>
<link rel="stylesheet" href="wc.css">
<link rel="stylesheet" href="vendor/katex.min.css">
<script defer src="vendor/katex.min.js"></script>
<script defer src="vendor/marked.min.js"></script>
<style>
  /* Appunto come un documento di Word: foglio bianco sul tavolo grigio.
     Si modifica come in Typora: clic su un paragrafo o una formula = il suo
     Markdown, fuori = di nuovo impaginato. */
  @font-face { font-family: "Source Serif"; src: url("vendor/serif/SourceSerif4-Regular.ttf") format("truetype"); font-weight: 400; font-style: normal; }
  @font-face { font-family: "Source Serif"; src: url("vendor/serif/SourceSerif4-It.ttf") format("truetype"); font-weight: 400; font-style: italic; }
  @font-face { font-family: "Source Serif"; src: url("vendor/serif/SourceSerif4-Bold.ttf") format("truetype"); font-weight: 600 700; font-style: normal; }
  html, body { background: var(--canvas); }
  body { display: flex; height: 100%; overflow: hidden; }
  /* riquadro con l'elenco degli appunti (come «Riquadro di spostamento» di Word) */
  #nav { width: 260px; flex-shrink: 0; background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; }
  body.nonav #nav { display: none; }
  #nav .top { padding: 10px 10px 8px; display: flex; flex-direction: column; gap: 6px; }
  #nav .h { display: flex; align-items: center; font-weight: 600; font-size: 13px; }
  #nav .h span { flex: 1; }
  #q { width: 100%; }
  #list { flex: 1; overflow: auto; padding: 2px 6px 10px; }
  .item { padding: 6px 8px; border-radius: 4px; cursor: pointer; }
  .item:hover { background: var(--hover); }
  .item.on { background: var(--checked); }
  .item .t { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .d { font-size: 11.5px; color: var(--text-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #scroll { flex: 1; overflow: auto; min-width: 0; position: relative; }
  #bar { display: none; position: sticky; top: 0; z-index: 5; gap: 6px; align-items: center; padding: 6px 12px; background: var(--ribbon); border-bottom: 1px solid var(--border); }
  body.browser #bar { display: flex; }
  #bar .name { font-weight: 600; margin-right: auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #zoomwrap { padding: 28px 0 80px; transform-origin: top center; }
  #page { width: 794px; min-height: 1123px; margin: 0 auto; background: var(--page); color: var(--page-ink);
          box-shadow: 0 0 0 1px rgba(0,0,0,.06), 0 2px 6px var(--page-shadow), 0 8px 24px var(--page-shadow);
          padding: 76px 88px 96px; font: 16px/1.6 "Source Serif", Georgia, "Times New Roman", serif; cursor: text; position: relative; }
  #page h1, #page h2, #page h3, #page h4 { font-family: "Inter", sans-serif; line-height: 1.25; margin: .2em 0 .3em; color: #1a1a1a; }
  #page h1 { font-size: 26px; font-weight: 600; } #page h2 { font-size: 21px; font-weight: 600; } #page h3 { font-size: 17px; font-weight: 600; }
  #page p { margin: 0; }
  #page ul, #page ol { margin: 0; padding-left: 1.6em; }
  #page pre { background: #f5f5f5; padding: 8px 10px; border-radius: 4px; overflow-x: auto; font-size: 13px; }
  #page code { background: #f2f2f2; padding: 0 3px; border-radius: 3px; font-size: .9em; }
  #page table { border-collapse: collapse; } #page td, #page th { border: 1px solid #ccc; padding: 4px 8px; }
  #page blockquote { margin: 0; padding-left: 12px; border-left: 3px solid #d0d0d0; color: #555; }
  #page hr { border: 0; border-top: 1px solid #ccc; margin: 10px 0; }
  #page .unk { background: #fff3c4; border-radius: 3px; padding: 0 2px; }
  #page a { color: #2b47b5; }
  .blk { border-radius: 3px; padding: 3px 6px; margin: 0 -6px 10px; position: relative; min-height: 1.6em; }
  .blk:hover { background: rgba(59,91,219,.05); }
  .blk.flash { animation: flash 2.2s ease-out; }
  @keyframes flash { 0% { background: rgba(59,91,219,.22); } 100% { background: transparent; } }
  .blk.editing { background: #f7f8fc; box-shadow: inset 2px 0 0 #3b5bdb; padding: 6px 8px; }
  .blk.editing textarea { width: 100%; border: 0; background: transparent; resize: none; overflow: hidden; padding: 0; color: #1f1f1f;
                          font: 14px/1.55 ui-monospace, "SF Mono", Menlo, monospace; outline: none; display: block; }
  .blk.editing .pv { border-top: 1px dashed #d6d9e6; margin-top: 6px; padding-top: 6px; }
  .blk.editing .pv:empty { display: none; }
  #page .ph { color: #a8a8a8; font-style: italic; }
  #tail { min-height: 120px; cursor: text; }
  #srcmode { display: none; width: 100%; min-height: 900px; border: 0; resize: none; outline: none; background: transparent;
             font: 14px/1.6 ui-monospace, "SF Mono", Menlo, monospace; color: #1f1f1f; }
  body.source #srcmode { display: block; }
  body.source #blocks, body.source #tail { display: none; }
  #empty { color: #8a8a8a; text-align: center; padding: 120px 20px; font-family: "Inter", sans-serif; }
  #banner { display: none; position: sticky; top: 8px; z-index: 6; width: 794px; margin: 0 auto 8px; background: var(--checked);
            border: 1px solid var(--accent); border-radius: 6px; padding: 7px 12px; font-size: 12.5px; }
  #banner button { margin-left: 8px; }
  @media print {
    html, body { background: #fff; height: auto; overflow: visible; display: block; }
    #nav, #bar, #banner { display: none !important; }
    #scroll { overflow: visible; } #zoomwrap { padding: 0; transform: none !important; }
    #page { box-shadow: none; width: auto; min-height: 0; padding: 0; }
    .blk:hover, .blk.flash { background: none; }
  }
/* figure ridisegnate dal foglio (SVG accanto all'appunto) */
.blk img { display: block; max-width: 100%; height: auto; margin: 10px auto 4px; }
/* elenchi con caselle ("- [ ]"): niente pallino */
li:has(> input[type="checkbox"]) { list-style: none; margin-left: -1.3em; }
li > input[type="checkbox"] { margin: 0 .45em 0 0; vertical-align: -1px; }
</style>
</head>
<body class="nonav">
<aside id="nav">
  <div class="top">
    <div class="h"><span>Appunti</span><button class="ghost" id="navclose" title="Chiudi l'elenco">✕</button></div>
    <input id="q" placeholder="Cerca negli appunti…" autocomplete="off">
    <button id="newnote">＋ Nuovo appunto</button>
  </div>
  <div id="list"></div>
</aside>
<div id="scroll">
  <div id="bar">
    <span class="name" id="name">Appunti</span>
    <button id="b-nav">Elenco</button><button id="b-src">Sorgente</button><button id="b-copy">Copia</button>
  </div>
  <div id="banner"><span id="bannertext"></span><button id="reload" class="primary">Ricarica</button><button id="keep" class="ghost">Tieni il mio</button></div>
  <div id="zoomwrap">
    <div id="page">
      <div id="blocks"></div>
      <div id="tail" title="Clic per scrivere un nuovo paragrafo"></div>
      <textarea id="srcmode" spellcheck="false"></textarea>
    </div>
  </div>
</div>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const params = new URLSearchParams(location.search);
const embed = params.get("embed") === "1";
if (params.get("nav") === "1") document.body.classList.remove("nonav");
if (params.get("theme")) document.documentElement.dataset.theme = params.get("theme");
if (!embed) document.body.classList.add("browser");

// --- verso l'app (WebView incorporata) ---
function toApp(msg) { try { window.ipc && window.ipc.postMessage(JSON.stringify(msg)); } catch (e) {} }

// --- Markdown + formule ---
function esc(s) { return String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function tex(src, display) {
  if (!window.katex) return esc(display ? "$$" + src + "$$" : "$" + src + "$");
  try { return katex.renderToString(src, { displayMode: display, throwOnError: false, strict: "ignore" }); }
  catch (e) { return esc(src); }
}
function renderMd(src) {
  if (!window.marked) return "<div style='white-space:pre-wrap'>" + esc(src) + "</div>";
  const code = [], math = [];
  const keep = (html) => "%%M" + (math.push(html) - 1) + "%%";
  src = src.replace(/```[\s\S]*?(```|$)|`[^`\n]+`/g, (m) => "%%C" + (code.push(m) - 1) + "%%");
  src = src.replace(/\$\$([\s\S]+?)\$\$|\\\[([\s\S]+?)\\\]/g, (m, a, b) => keep(tex(a ?? b, true)));
  src = src.replace(/\\\(([\s\S]+?)\\\)/g, (m, a) => keep(tex(a, false)));
  src = src.replace(/(^|[^\\$])\$([^\s$](?:[^$\n]*?[^\s\\$])?)\$(?!\d)/g, (m, pre, a) => pre + keep(tex(a, false)));
  src = src.replace(/%%C(\d+)%%/g, (m, i) => code[+i]);
  return marked.parse(src, { breaks: true })
    .replace(/%%M(\d+)%%/g, (m, i) => math[+i])
    .replace(/\[\?\]/g, "<span class='unk' title='illeggibile sul foglio'>[?]</span>")
    // immagini accanto all'appunto (figure ridisegnate): si prendono da exports/
    .replace(/<img src="(?![a-z]+:|\/)([^"]+)"/gi, (m, f) => '<img src="api/appunti-file/' + encodeURIComponent(f) + '"');
}

// --- blocchi (paragrafi, formule, titoli, elenchi…) ---
function splitBlocks(t) {
  const lines = t.replace(/\r\n/g, "\n").split("\n");
  const out = []; let cur = [], fence = null, math = false;
  const flush = () => { const s = cur.join("\n").replace(/^\n+|\s+$/g, ""); if (s.trim()) out.push(s); cur = []; };
  for (const l of lines) {
    const tl = l.trim();
    if (fence) { cur.push(l); if (tl.startsWith(fence)) fence = null; continue; }
    if (math) { cur.push(l); if (/\$\$\s*$/.test(tl)) math = false; continue; }
    if (/^(```|~~~)/.test(tl)) { fence = tl.slice(0, 3); cur.push(l); continue; }
    if (tl.startsWith("$$") && !/\$\$\s*$/.test(tl.slice(2))) { math = true; cur.push(l); continue; }
    if (tl === "") { flush(); continue; }
    if (/^#{1,6}\s/.test(tl) || /^(-{3,}|\*{3,}|_{3,})$/.test(tl)) { flush(); out.push(l.trimEnd()); continue; }
    cur.push(l);
  }
  flush();
  return out;
}
const joinBlocks = (bs) => bs.map((b) => b.trim()).filter(Boolean).join("\n\n") + "\n";

let items = [], cur = null, blocks = [], saved = "", editing = -1, sourceMode = false, zoom = 1;
const text = () => (sourceMode ? $("srcmode").value : joinBlocks(blocks));
const dirty = () => cur && text() !== saved;

function drawBlocks(flashFrom) {
  const box = $("blocks");
  box.innerHTML = "";
  if (!cur) { box.innerHTML = "<div id='empty'>Nessun appunto aperto.<br>Le trascrizioni («Trascrivi») e le chat salvate finiscono qui.</div>"; return; }
  if (!blocks.length) {
    const d = document.createElement("div"); d.className = "blk"; d.innerHTML = "<p class='ph'>" + T("Appunto vuoto: clic per scrivere (Markdown e formule $…$)") + "</p>";
    d.onclick = () => editBlock(0, true); box.appendChild(d); return;
  }
  blocks.forEach((b, i) => {
    const d = document.createElement("div");
    d.className = "blk" + (flashFrom && flashFrom.has(i) ? " flash" : "");
    d.dataset.i = i;
    d.innerHTML = renderMd(b);
    d.addEventListener("mousedown", (e) => { if (e.target.closest("a") || d.classList.contains("editing")) return; e.preventDefault(); editBlock(i); });
    box.appendChild(d);
  });
}

function autoH(ta) { ta.style.height = "auto"; ta.style.height = ta.scrollHeight + "px"; }
const needsPreview = (s) => /\$|\\\(|\\\[|\|.*\||^\s*[-*+] |^\s*\d+\. /m.test(s);

// Clic su un blocco: il suo Markdown, con l'anteprima sotto se ha formule.
function editBlock(i, append, caretAtEnd = true) {
  if (sourceMode) return;
  if (editing >= 0) { const k = editing, d = commitEdit(true); if (!append && i > k) i += d; }
  if (append || i >= blocks.length) { blocks.push(""); i = blocks.length - 1; }
  editing = i;
  const el = $("blocks").querySelector(".blk[data-i='" + i + "']") || (() => { drawBlocks(); return $("blocks").querySelector(".blk[data-i='" + i + "']"); })();
  if (!el) { drawBlocks(); return; }
  el.className = "blk editing";
  el.innerHTML = "<textarea spellcheck='false'></textarea><div class='pv'></div>";
  const ta = el.querySelector("textarea"), pv = el.querySelector(".pv");
  ta.value = blocks[i];
  const live = () => { blocks[i] = ta.value; autoH(ta); pv.innerHTML = needsPreview(ta.value) ? renderMd(ta.value) : ""; changed(); };
  ta.addEventListener("input", live);
  ta.addEventListener("keydown", (e) => blockKeys(e, ta, i));
  ta.addEventListener("blur", () => setTimeout(() => { if (editing === i && document.activeElement !== ta) commitEdit(true); }, 120));
  live();
  ta.focus();
  const p = caretAtEnd ? ta.value.length : 0;
  ta.setSelectionRange(p, p);
  toApp({ cmd: "note_focus" });
}

// Fine della modifica di un blocco: si reimpagina (un blocco può diventarne più d'uno).
function commitEdit(redraw) {
  if (editing < 0) return 0;
  const i = editing; editing = -1;
  const parts = splitBlocks(blocks[i] || "");
  blocks.splice(i, 1, ...parts);
  if (redraw) drawBlocks();
  changed();
  return parts.length - 1; // quanti blocchi in più (o in meno) dopo questo
}

function blockKeys(e, ta, i) {
  const mod = e.metaKey || e.ctrlKey;
  if (e.key === "Escape" || (mod && e.key === "Enter")) { e.preventDefault(); commitEdit(true); return; }
  const atStart = ta.selectionStart === 0 && ta.selectionEnd === 0;
  const atEnd = ta.selectionStart === ta.value.length;
  // Invio su una riga vuota alla fine: nuovo paragrafo (fuori da formule e codice)
  if (e.key === "Enter" && !e.shiftKey && atEnd && /\n$/.test(ta.value) && !/^\s*(\$\$|```)/.test(ta.value)) {
    e.preventDefault();
    blocks[i] = ta.value.replace(/\n+$/, "");
    const n = splitBlocks(blocks[i]).length;
    commitEdit(true);
    blocks.splice(i + Math.max(n, 1), 0, "");
    drawBlocks();
    editBlock(i + Math.max(n, 1));
    return;
  }
  if (e.key === "Backspace" && atStart && ta.value === "" ) { e.preventDefault(); blocks.splice(i, 1); editing = -1; drawBlocks(); changed(); if (i > 0) editBlock(i - 1); return; }
  if (e.key === "ArrowUp" && atStart && i > 0) { e.preventDefault(); commitEdit(true); editBlock(i - 1); return; }
  if (e.key === "ArrowDown" && atEnd && i + 1 < blocks.length) { e.preventDefault(); const d = commitEdit(true); editBlock(i + 1 + d, false, false); return; }
  if (mod && e.key.toLowerCase() === "b") { e.preventDefault(); wrap(ta, "**", "**"); }
  if (mod && e.key.toLowerCase() === "i") { e.preventDefault(); wrap(ta, "*", "*"); }
  if (mod && e.key.toLowerCase() === "m") { e.preventDefault(); wrap(ta, "$", "$"); }
}

function wrap(ta, a, b, ph = "") {
  const s = ta.selectionStart, en = ta.selectionEnd, sel = ta.value.slice(s, en) || ph;
  ta.value = ta.value.slice(0, s) + a + sel + b + ta.value.slice(en);
  ta.setSelectionRange(s + a.length, s + a.length + sel.length);
  ta.dispatchEvent(new Event("input"));
}
function linePrefix(ta, fn) {
  const v = ta.value, s = v.lastIndexOf("\n", ta.selectionStart - 1) + 1;
  let e = v.indexOf("\n", ta.selectionEnd); if (e < 0) e = v.length;
  const lines = v.slice(s, e).split("\n").map(fn);
  ta.value = v.slice(0, s) + lines.join("\n") + v.slice(e);
  ta.dispatchEvent(new Event("input"));
}

// --- salvataggio automatico ---
let saveT = null;
function changed() {
  clearTimeout(saveT);
  saveT = setTimeout(save, 700);
  report();
}
function words() { return (text().replace(/\$\$[\s\S]*?\$\$|\$[^$\n]*\$/g, " ∑ ").match(/[\p{L}\p{N}∑]+/gu) || []).length; }
function report() { toApp({ cmd: "note_state", name: cur, words: words(), dirty: !!dirty() }); }
async function save() {
  clearTimeout(saveT);
  if (!cur || !dirty()) return;
  const t = text();
  try {
    const r = await fetch("api/appunti/" + encodeURIComponent(cur), { method: "POST", body: t });
    if (r.ok) saved = t;
  } catch (e) {}
  report();
}

// --- aprire ---
async function open(name, keepScroll) {
  if (cur && dirty()) await save();
  const r = await fetch("api/appunti/" + encodeURIComponent(name), { cache: "no-store" });
  if (!r.ok) { cur = null; drawBlocks(); return false; }
  const t = await r.text();
  cur = name; saved = t; blocks = splitBlocks(t); editing = -1;
  $("srcmode").value = t;
  $("name").textContent = name;
  document.title = name + " — " + T("Appunti");
  history.replaceState(null, "", "?" + new URLSearchParams({ ...Object.fromEntries(params), f: name }).toString());
  drawBlocks();
  if (!keepScroll) $("scroll").scrollTop = 0;
  drawList();
  toApp({ cmd: "note_open", name });
  report();
  return true;
}

// Cambiato da fuori (l'AI ci ha scritto, o un altro programma): si ricarica,
// mettendo in evidenza i blocchi nuovi.
let external = null;
async function poll() {
  if (!cur || document.hidden) return;
  let t;
  try { const r = await fetch("api/appunti/" + encodeURIComponent(cur), { cache: "no-store" }); if (!r.ok) return; t = await r.text(); } catch (e) { return; }
  if (t === saved) return;
  if (!dirty() && editing < 0) applyExternal(t);
  else { external = t; $("bannertext").textContent = "L'appunto è stato cambiato da fuori (forse dall'AI)."; $("banner").style.display = "block"; }
}
function applyExternal(t) {
  const old = new Set(blocks.map((b) => b.trim()));
  saved = t; blocks = splitBlocks(t); editing = -1; $("srcmode").value = t;
  const fresh = new Set(); blocks.forEach((b, i) => { if (!old.has(b.trim())) fresh.add(i); });
  drawBlocks(fresh);
  const first = [...fresh][0];
  if (first !== undefined) $("blocks").querySelector(".blk[data-i='" + first + "']")?.scrollIntoView({ behavior: "smooth", block: "center" });
  external = null; $("banner").style.display = "none";
  report();
}
$("reload").onclick = () => external !== null && applyExternal(external);
$("keep").onclick = () => { external = null; $("banner").style.display = "none"; save(); };

// --- elenco degli appunti ---
function when(t) {
  const d = new Date(t * 1000), now = new Date();
  const hm = d.toLocaleTimeString(I18N_DATE, { hour: "2-digit", minute: "2-digit" });
  return d.toDateString() === now.toDateString() ? T("oggi {}", hm) : d.toLocaleDateString(I18N_DATE, { day: "2-digit", month: "short" }) + " " + hm;
}
function drawList() {
  const f = $("q").value.trim().toLowerCase();
  const el = $("list");
  const shown = items.filter((i) => !f || (i.title + " " + i.name).toLowerCase().includes(f));
  el.innerHTML = shown.length ? "" : "<div style='padding:10px;color:var(--text-dim)'>" + (items.length ? "Nessun risultato" : "Ancora nessun appunto") + "</div>";
  for (const i of shown) {
    const d = document.createElement("div");
    d.className = "item" + (cur === i.name ? " on" : "");
    d.innerHTML = "<div class='t'></div><div class='d'></div>";
    d.querySelector(".t").textContent = i.title || i.name;
    d.querySelector(".d").textContent = when(i.mtime) + " · " + i.name;
    d.onclick = () => open(i.name);
    el.appendChild(d);
  }
}
async function loadList() { try { items = await (await fetch("api/appunti", { cache: "no-store" })).json(); } catch (e) { return; } drawList(); }

async function newNote() {
  const p = (n) => String(n).padStart(2, "0"), d = new Date();
  const name = "appunto-" + d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + "-" + p(d.getHours()) + p(d.getMinutes()) + p(d.getSeconds()) + ".md";
  await fetch("api/appunti/" + encodeURIComponent(name), { method: "POST", body: "" });
  await loadList();
  await open(name);
  editBlock(0, true);
}

// --- comandi dalla barra dell'app (egui) ---
function activeTa() { return editing >= 0 ? $("blocks").querySelector(".blk.editing textarea") : sourceMode ? $("srcmode") : null; }
function insertBlock(md, sel) {
  if (sourceMode) { const ta = $("srcmode"); const p = ta.selectionStart; ta.value = ta.value.slice(0, p) + "\n\n" + md + "\n\n" + ta.value.slice(p); ta.dispatchEvent(new Event("input")); return; }
  const at = editing >= 0 ? editing + 1 : blocks.length;
  commitEdit(true);
  blocks.splice(at, 0, md);
  drawBlocks(); editBlock(at);
  const ta = activeTa();
  if (ta && sel) { const k = ta.value.indexOf(sel); if (k >= 0) ta.setSelectionRange(k, k + sel.length); }
}
function setZoom(z) {
  zoom = Math.min(4, Math.max(0.3, z));
  $("zoomwrap").style.zoom = zoom;
  toApp({ cmd: "note_zoom", zoom });
}
const cmds = {
  bold: () => { const t = activeTa(); t ? wrap(t, "**", "**", "testo") : insertBlock("**testo**", "testo"); },
  italic: () => { const t = activeTa(); t ? wrap(t, "*", "*", "testo") : insertBlock("*testo*", "testo"); },
  math: () => { const t = activeTa(); t ? wrap(t, "$", "$", "x^2") : insertBlock("$x^2$", "x^2"); },
  mathblock: () => insertBlock("$$\n\\int_a^b f(x)\\,dx\n$$", "\\int_a^b f(x)\\,dx"),
  cases: () => insertBlock("$$\n\\begin{cases}\nx - y = 1 \\\\\nx + y = 0\n\\end{cases}\n$$", "x - y = 1 \\\\\nx + y = 0"),
  h1: () => { const t = activeTa(); t ? linePrefix(t, (l) => "# " + l.replace(/^#+\s*/, "")) : insertBlock("# Titolo", "Titolo"); },
  h2: () => { const t = activeTa(); t ? linePrefix(t, (l) => "## " + l.replace(/^#+\s*/, "")) : insertBlock("## Titolo", "Titolo"); },
  p: () => { const t = activeTa(); if (t) linePrefix(t, (l) => l.replace(/^(#+|[-*+]|\d+\.|>)\s*/, "")); },
  ul: () => { const t = activeTa(); t ? linePrefix(t, (l) => (/^[-*+]\s/.test(l) ? l.replace(/^[-*+]\s/, "") : "- " + l)) : insertBlock("- primo\n- secondo", "primo"); },
  ol: () => { const t = activeTa(); let n = 0; t ? linePrefix(t, (l) => (/^\d+\.\s/.test(l) ? l.replace(/^\d+\.\s/, "") : ++n + ". " + l)) : insertBlock("1. primo\n2. secondo", "primo"); },
  quote: () => { const t = activeTa(); t ? linePrefix(t, (l) => "> " + l) : insertBlock("> citazione", "citazione"); },
  table: () => insertBlock("| a | b |\n|---|---|\n| 1 | 2 |"),
  hr: () => insertBlock("---"),
  newpara: () => editBlock(blocks.length, true),
  source: () => {
    if (!cur) return;
    commitEdit(false);
    sourceMode = !sourceMode;
    document.body.classList.toggle("source", sourceMode);
    if (sourceMode) { $("srcmode").value = joinBlocks(blocks); autoH($("srcmode")); $("srcmode").focus(); }
    else { blocks = splitBlocks($("srcmode").value); drawBlocks(); changed(); }
    toApp({ cmd: "note_source", on: sourceMode });
  },
  copy: async () => { const t = text(); try { await navigator.clipboard.writeText(t); } catch (e) { const ta = document.createElement("textarea"); ta.value = t; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove(); } toApp({ cmd: "status", text: "Markdown dell'appunto copiato." }); },
  nav: () => { document.body.classList.toggle("nonav"); if (!document.body.classList.contains("nonav")) { loadList(); $("q").focus(); } },
  navshow: () => { document.body.classList.remove("nonav"); loadList(); },
  new: () => newNote(),
  save: () => save(),
  zoomin: () => setZoom(zoom * 1.15), zoomout: () => setZoom(zoom / 1.15), zoomfit: () => setZoom(1),
};
window.wsNote = {
  open: (name) => open(name),
  cmd: (c, arg) => (cmds[c] ? cmds[c](arg) : null),
  zoom: (z) => setZoom(z),
  reload: () => poll(),
  text: () => text(),
  name: () => cur,
  flush: () => save(),
};

// --- eventi ---
$("tail").addEventListener("mousedown", (e) => { e.preventDefault(); if (cur) editBlock(blocks.length, true); });
$("page").addEventListener("mousedown", (e) => { if (e.target.id === "page" && cur) { e.preventDefault(); editBlock(blocks.length, true); } });
$("srcmode").addEventListener("input", () => { autoH($("srcmode")); changed(); });
$("q").addEventListener("input", drawList);
$("navclose").onclick = () => document.body.classList.add("nonav");
$("newnote").onclick = newNote;
$("b-nav").onclick = cmds.nav; $("b-src").onclick = cmds.source; $("b-copy").onclick = cmds.copy;
addEventListener("keydown", (e) => {
  const mod = e.metaKey || e.ctrlKey;
  if (mod && e.key.toLowerCase() === "s") { e.preventDefault(); save(); }
  if (mod && e.key === "/") { e.preventDefault(); cmds.source(); }
  if (mod && (e.key === "=" || e.key === "+")) { e.preventDefault(); cmds.zoomin(); }
  if (mod && e.key === "-") { e.preventDefault(); cmds.zoomout(); }
  if (mod && e.key === "0") { e.preventDefault(); cmds.zoomfit(); }
});
// pizzico sul trackpad: WebKit (gesture*) e Chromium/GTK (Ctrl + rotella)
let gz = 1;
addEventListener("gesturestart", (e) => { e.preventDefault(); gz = zoom; });
addEventListener("gesturechange", (e) => { e.preventDefault(); setZoom(gz * e.scale); });
addEventListener("wheel", (e) => { if (e.ctrlKey) { e.preventDefault(); setZoom(zoom * Math.exp(-e.deltaY / 200)); } }, { passive: false });
addEventListener("pagehide", () => { if (cur && dirty()) navigator.sendBeacon("api/appunti/" + encodeURIComponent(cur), text()); });
document.addEventListener("visibilitychange", () => { if (document.hidden) save(); });

window.addEventListener("load", async () => {
  await loadList();
  const f = params.get("f");
  if (!(f && (await open(f))) && !embed && items.length) await open(items[0].name);
  if (!cur) drawBlocks();
  const c = params.get("cmd");
  if (c && cmds[c] && c !== "nav") cmds[c]();
  setInterval(poll, 1200);
  setInterval(loadList, 8000);
});
</script>
</body>
</html>
