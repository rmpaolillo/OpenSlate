<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B6CF6"/>
      <stop offset="1" stop-color="#1E3AA8"/>
    </linearGradient>
    <linearGradient id="pen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2B2F38"/>
      <stop offset="1" stop-color="#4A505E"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0B1A4F" flood-opacity="0.45"/>
    </filter>
  </defs>
  <!-- fondo: quadrato arrotondato come le icone di macOS -->
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#bg)"/>
  <!-- il foglio dello Slate, leggermente inclinato -->
  <g filter="url(#shadow)" transform="rotate(-8 512 520)">
    <rect x="236" y="196" width="552" height="660" rx="44" fill="#FFFFFF"/>
    <rect x="236" y="196" width="552" height="92" rx="44" fill="#E9EEFB"/>
    <rect x="236" y="244" width="552" height="44" fill="#E9EEFB"/>
    <g stroke="#C9D5F3" stroke-width="10" stroke-linecap="round">
      <line x1="300" y1="380" x2="724" y2="380"/>
      <line x1="300" y1="470" x2="724" y2="470"/>
      <line x1="300" y1="560" x2="724" y2="560"/>
      <line x1="300" y1="650" x2="724" y2="650"/>
      <line x1="300" y1="740" x2="724" y2="740"/>
    </g>
    <!-- la firma, in inchiostro blu -->
    <path d="M318 640 C 350 560, 382 545, 392 600 S 410 690, 448 610 S 492 540, 512 612 S 540 676, 572 606 S 576 608, 578 612"
          fill="none" stroke="#2350E0" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- la penna -->
  <g transform="rotate(38 690 470)">
    <rect x="650" y="150" width="80" height="440" rx="40" fill="url(#pen)"/>
    <rect x="650" y="210" width="80" height="26" fill="#9BB4FF"/>
    <path d="M650 560 L730 560 L700 660 Q690 690 680 660 Z" fill="#D7DCE6"/>
    <path d="M684 650 L696 650 L690 690 Z" fill="#2350E0"/>
  </g>
</svg>
