# whisper.cpp (src/voice.rs) si compila per i processori di chi usa l'app, non
# per quello della macchina che compila: niente -march=native. Sugli x86-64
# (Windows, Linux, Mac Intel) usa AVX2 (processori dal 2013 in poi); sui
# processori ARM (Mac Apple) queste righe non contano.
[env]
GGML_NATIVE = "OFF"
GGML_AVX = "ON"
GGML_AVX2 = "ON"
GGML_FMA = "ON"
GGML_F16C = "ON"
GGML_BMI2 = "ON"

# I dati di lingua di WordCraft (sillabazione e dizionari, dalla 0.15 in craft-i18n): li legge
# craft-proof durante la compilazione. Copia fissa in vendor/craft-i18n (vedi vendor/README.md).
CRAFT_I18N_DIR = { value = "vendor/craft-i18n", relative = true }
