[package]
name = "openslate"
version = "0.2.0"
edition = "2021"
authors = ["Marco Paolillo"]
description = "Free, open-source companion app for the Wacom Bamboo Slate"
license = "GPL-3.0-or-later"
repository = "https://github.com/rmpaolillo/OpenSlate"
homepage = "https://github.com/rmpaolillo/OpenSlate"
readme = "README.md"
keywords = ["wacom", "bamboo-slate", "smartpad", "handwriting", "egui"]
categories = ["gui", "hardware-support"]
# I motori di WordCraft e PdfCraft (documenti Word e PDF) chiedono Rust 1.95
rust-version = "1.95"
publish = false

[dependencies]
# BLE cross-platform (su macOS usa CoreBluetooth, su Linux BlueZ/DBus, su Windows WinRT)
btleplug = "0.11"
uuid = "1"
futures = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "net", "io-util"] }

# GUI nativa (eframe re-esporta egui come eframe::egui)
eframe = "0.36"
# Icone per i pulsanti (font Phosphor)
egui-phosphor = "0.14"

# Lingua del sistema (interfaccia multilingua)
sys-locale = "0.3"

# CLI + utility
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = "0.4"

# Export PNG (rasterizzazione dei tratti, anche per l'OCR)
tiny-skia = "0.11"
# OCR via modello con visione (API compatibile OpenAI)
ureq = { version = "2", features = ["json"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
base64 = "0.22"
# Impronte SHA-256 dei file scaricati dall'aggiornamento
sha2 = "0.10"
# Configurazione dei provider AI (ai.toml)
toml = "0.8"
# Immagine negli appunti (Copia immagine → incolla in una chat AI)
arboard = "3"
# Documenti: lettura/scrittura PDF (firma sovrapposta), dialogo file
lopdf = { version = "0.45", default-features = false }  # quello di PdfCraft (vedi [patch])
rfd = { version = "0.14", default-features = false, features = ["gtk3"] }
# Documenti Word (.docx, .doc, .odt, .rtf): pagine e firma col motore di WordCraft
# (MIT OR Apache-2.0, © ArtCraft Team), senza la sua interfaccia. Da GitHub, versione fissa.
wordcraft-engine = { git = "https://github.com/storytold/wordcraft", rev = "117aea31a8e61bd3e306e9210800cdc42897e3c1" }
# Foto (PNG, JPEG, WebP, TIFF…): le librerie di PhotoCraft per leggerle, scriverle e
# disegnarci sopra col pennello (MIT OR Apache-2.0, © ArtCraft Team), senza la sua
# interfaccia. Da GitHub, versione fissa.
photocraft-codecs = { git = "https://github.com/storytold/photocraft", rev = "872748fb5b2a53e09dd4e385e31968d985c0515b" }
photocraft-paint = { git = "https://github.com/storytold/photocraft", rev = "872748fb5b2a53e09dd4e385e31968d985c0515b" }
photocraft-raster = { git = "https://github.com/storytold/photocraft", rev = "872748fb5b2a53e09dd4e385e31968d985c0515b" }
photocraft-color = { git = "https://github.com/storytold/photocraft", rev = "872748fb5b2a53e09dd4e385e31968d985c0515b" }
photocraft-geom = { git = "https://github.com/storytold/photocraft", rev = "872748fb5b2a53e09dd4e385e31968d985c0515b" }
# Immagini SVG: pagine e firma col motore di VectorCraft (MIT OR Apache-2.0,
# © ArtCraft Team), senza la sua interfaccia. Da GitHub, versione fissa.
vectorcraft-engine = { git = "https://github.com/storytold/vectorcraft", rev = "bc1ae0825264c5ca4b27bd718d6e04f2121b8bb3" }
vectorcraft-render = { git = "https://github.com/storytold/vectorcraft", rev = "bc1ae0825264c5ca4b27bd718d6e04f2121b8bb3" }
# PDF: il disegno nitido delle pagine col motore di PdfCraft (MIT OR Apache-2.0,
# © ArtCraft Team), senza la sua interfaccia. Da GitHub, versione fissa.
pdfcraft-render = { git = "https://github.com/storytold/pdfcraft", rev = "ec0a965074f376a5bf610435948e4e5184bf3299" }
# Chat e appunti dentro la finestra (WebView di sistema: WKWebView su macOS)
wry = "0.57"
tao = "0.37"

[profile.release]
opt-level = 3
lto = "thin"

# macOS: menu Modifica (Cmd+C / Cmd+V nella finestra «Appunti»)
[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.17", default-features = false }

# Linux (X11): le WebView dentro la finestra usano GTK, che va fatto girare
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

# Le correzioni a librerie esterne che usano WordCraft e PdfCraft (le loro [patch]
# valgono solo nei loro progetti: qui vanno ripetute).
[patch.crates-io]
# krilla e hayro-* da craft-libs (quelli di VectorCraft, che li vuole più nuovi);
# hayro, lopdf e vello_common da PdfCraft
krilla = { git = "https://github.com/storytold/craft-libs", rev = "ca50d63b773c99f96e75c77ce5a1d21e7c9cda0d" }
hayro-interpret = { git = "https://github.com/storytold/craft-libs", rev = "ca50d63b773c99f96e75c77ce5a1d21e7c9cda0d" }
hayro = { git = "https://github.com/storytold/craft-libs", rev = "ca50d63b773c99f96e75c77ce5a1d21e7c9cda0d" }
hayro-syntax = { git = "https://github.com/storytold/craft-libs", rev = "ca50d63b773c99f96e75c77ce5a1d21e7c9cda0d" }
hayro-jbig2 = { git = "https://github.com/storytold/craft-libs", rev = "ca50d63b773c99f96e75c77ce5a1d21e7c9cda0d" }
lopdf = { git = "https://github.com/storytold/pdfcraft", rev = "ec0a965074f376a5bf610435948e4e5184bf3299" }
vello_common = { git = "https://github.com/storytold/pdfcraft", rev = "ec0a965074f376a5bf610435948e4e5184bf3299" }

# Pacchetto .deb (Linux), fatto dalla CI con cargo-deb
[package.metadata.deb]
name = "openslate"
maintainer = "Marco Paolillo"
copyright = "2026, Marco Paolillo"
license-file = ["LICENSE", "0"]
extended-description = "Free companion app for the Wacom Bamboo Slate: live board over Bluetooth, offline page sync, signing Word and PDF documents with the pen, handwriting transcription to text and an AI assistant."
section = "graphics"
priority = "optional"
depends = "$auto, bluez"
assets = [
    ["target/release/openslate", "usr/bin/", "755"],
    ["packaging/linux/openslate.desktop", "usr/share/applications/", "644"],
    ["assets/icon/openslate-256.png", "usr/share/icons/hicolor/256x256/apps/openslate.png", "644"],
    ["assets/icon/openslate-512.png", "usr/share/icons/hicolor/512x512/apps/openslate.png", "644"],
    ["README.md", "usr/share/doc/openslate/README.md", "644"],
]
