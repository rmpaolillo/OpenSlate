# Copia di crates/layout di WordCraft (9130181a5fdaee2293e67756fd5458c601489f3c, 0.10.0), con le dipendenze del workspace
# scritte per esteso. Modifica di OpenSlate: vedi vendor/README.md.
[package]
name = "wordcraft-layout"
version = "0.10.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/storytold/wordcraft"
description = "WordCraft layout: shaping, line breaking, tabs, lists, tables, pagination, headers/footers, hit testing"

[lints.rust]
unsafe_code = "forbid"

[dependencies]
wordcraft-geom = { git = "https://github.com/storytold/wordcraft", rev = "9130181a5fdaee2293e67756fd5458c601489f3c" }
wordcraft-doc = { git = "https://github.com/storytold/wordcraft", rev = "9130181a5fdaee2293e67756fd5458c601489f3c" }
wordcraft-fonts = { git = "https://github.com/storytold/wordcraft", rev = "9130181a5fdaee2293e67756fd5458c601489f3c" }
wordcraft-proof = { git = "https://github.com/storytold/wordcraft", rev = "9130181a5fdaee2293e67756fd5458c601489f3c" }
wordcraft-metafile = { git = "https://github.com/storytold/wordcraft", rev = "9130181a5fdaee2293e67756fd5458c601489f3c" }
kurbo = { version = "0.13", features = ["serde"] }
unicode-bidi = "0.3"
unicode-linebreak = "0.1"
unicode-segmentation = "1"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff"] }
log = "0.4"

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
js-sys = "0.3"
